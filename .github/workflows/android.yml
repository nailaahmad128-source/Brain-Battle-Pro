name: Android CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Build the signed release AAB for Google Play (needs all secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
      # versionCode = run number + optional offset (repo variable VERSION_CODE_OFFSET)
        VERSION_CODE: ${{ github.run_number }}
      PRIVACY_EMAIL: ${{ vars.PRIVACY_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify release configuration
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS ADMOB_APP_ID \
                   ADMOB_BANNER_ID ADMOB_INTERSTITIAL_ID ADMOB_REWARDED_ID PRIVACY_EMAIL; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release build refused. Missing secrets/variables:$missing"
            exit 1
          fi

      - name: Generate Android scaffold (always fresh, exact package id)
        run: |
          # --org + --project-name become namespace/applicationId/MainActivity package:
          # com.midostudio + brainbattlepro = com.midostudio.brainbattlepro
          rm -rf android /tmp/scaffold
          flutter create --platforms=android --org com.midostudio \
            --project-name brainbattlepro /tmp/scaffold
          cp -r /tmp/scaffold/android ./android

      - name: Restore upload keystore (release only)
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Patch Android project (SDK 36, AdMob app id, signing)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          REQUIRE_PROD: ${{ env.IS_RELEASE }}
        run: python3 tool/prepare_android.py

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test

      - name: Build test APK (debug-signed, Google TEST ads)
        if: env.IS_RELEASE != 'true'
        run: |
          flutter build apk --release --build-number=$VERSION_CODE \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=ADS_TEST_MODE=true --dart-define=PRIVACY_EMAIL="$PRIVACY_EMAIL"

      - name: Build signed release AAB
        if: env.IS_RELEASE == 'true'
        env:
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          flutter build appbundle --release --build-number=$VERSION_CODE \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=ADMOB_BANNER="$ADMOB_BANNER_ID" \
            --dart-define=ADMOB_INTERSTITIAL="$ADMOB_INTERSTITIAL_ID" \
            --dart-define=ADMOB_REWARDED="$ADMOB_REWARDED_ID" \
            --dart-define=PRIVACY_EMAIL="$PRIVACY_EMAIL"

      - name: Verify AAB signature (must not be the debug key)
        if: env.IS_RELEASE == 'true'
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" | tee /tmp/cert.txt
          if grep -qi "Android Debug" /tmp/cert.txt; then
            echo "::error::AAB is signed with the DEBUG key"; exit 1
          fi

      - name: Audit merged permissions
        run: |
          M=$(find build/app/intermediates -path '*erged_manifest*' -name AndroidManifest.xml | grep -i release | head -1)
          echo "Merged manifest: $M"
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$M" | sed 's/.*name="//;s/"//' | sort -u | tee /tmp/perms.txt
          if grep -Eq 'CAMERA|RECORD_AUDIO|LOCATION|CONTACTS|READ_PHONE|STORAGE|READ_MEDIA|SMS|CALL_LOG' /tmp/perms.txt; then
            echo "::error::Unexpected sensitive permission in merged manifest"; exit 1
          fi

      - name: Verify built APK (package, launcher activity, AdMob id, permissions)
        if: env.IS_RELEASE != 'true'
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          $AAPT2 dump badging "$APK" > /tmp/badging.txt
          grep -E "^package:|launchable-activity|sdkVersion|targetSdkVersion|uses-permission:" /tmp/badging.txt
          grep -q "package: name='com.midostudio.brainbattlepro'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.midostudio.brainbattlepro.MainActivity'" /tmp/badging.txt
          $AAPT2 dump xmltree --file AndroidManifest.xml "$APK" | grep -A2 "gms.ads.APPLICATION_ID" | tee /tmp/admob.txt
          grep -q "ca-app-pub-" /tmp/admob.txt

      - name: Upload test APK
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brain-battle-pro-TEST-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB + symbols
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brain-battle-pro-release-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
            build/symbols
          if-no-files-found: error
          retention-days: 90

  smoke:
    # Installs the TEST APK on emulators (Android 10, 14 and 16), launches it, drives it
    # with random input and fails on any crash. Logs + screenshots are always uploaded.
    needs: build
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: brain-battle-pro-TEST-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator launch test (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tool/smoke_test.sh apk/app-release.apk
      - name: Upload logcat and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-api${{ matrix.api-level }}
          path: smoke_out
          if-no-files-found: warn
